name: CI & Build APK (Garnet TV)

on:
  push:
    branches: [ main, master, develop, 'feat/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Localization Completeness
        run: python3 .github/scripts/check_translations.py

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install SQLite (for Drift tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libsqlite3-dev

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Localizations
        run: flutter gen-l10n

      - name: Generate Mocks & Drift Code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate Database Migrations Schema
        run: dart run drift_dev schema generate drift_schemas/ test/generated_migrations/

      - name: Static Analysis
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log
          grep -E "^[[:space:]]*(error) •" analyze.log | head -n 20 | while IFS= read -r line; do echo "::error::$line"; done || true
          flutter analyze --no-fatal-infos \
            lib/models/tv_appearance_config.dart \
            lib/providers/battery_service.dart \
            lib/widgets/battery_status_widget.dart \
            lib/widgets/tv_focus_frame.dart \
            lib/widgets/tv_wallpaper_backdrop.dart \
            lib/widgets/settings/appearance_tuning_page.dart \
            lib/widgets/settings/focusable_slider_tile.dart

      - name: Run Tests
        run: flutter test

      - name: Build Debug APK (ready to sideload on TV)
        run: |
          flutter build apk --debug --target-platform=android-arm,android-arm64
          mkdir -p artifacts
          if [ -f build/app/outputs/flutter-apk/app-debug.apk ]; then
            cp build/app/outputs/flutter-apk/app-debug.apk artifacts/GarnetTV-debug.apk
          else
            cp build/app/outputs/apk/debug/*.apk artifacts/
          fi

      - name: Configure Optional Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          python3 -c "import os, base64; s = ''.join(os.environ['KEYSTORE_BASE64'].split()); m = len(s) % 4; s += '=' * (4 - m) if m else ''; open('android/my-release-key.jks', 'wb').write(base64.b64decode(s))"

      - name: Build Universal Release APK (ProGuard / R8 check)
        env:
          UNIVERSAL_ONLY: "true"
          KEYSTORE_FILE: "../my-release-key.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release --target-platform=android-arm,android-arm64
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk artifacts/GarnetTV-universal-release.apk
          elif [ -f build/app/outputs/apk/release/GarnetTV-universal-release.apk ]; then
            cp build/app/outputs/apk/release/GarnetTV-universal-release.apk artifacts/GarnetTV-universal-release.apk
          else
            cp build/app/outputs/apk/release/*.apk artifacts/
          fi
          ls -lh artifacts/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GarnetTV-APKs-${{ github.run_number }}
          path: artifacts/*.apk
          retention-days: 14
